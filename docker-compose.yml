services:
  postgres:
    image: postgres:15-alpine
    container_name: nova_postgres
    restart: always
    environment:
      POSTGRES_DB: novadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: nova_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: novadb
      JWT_SECRET: supersecretnova_key_2026
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: nova_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: